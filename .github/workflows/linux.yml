# Runs DeskSpace on real Ubuntu with a virtual screen and a window manager, and keeps screenshots.
name: Linux test

on:
  push:
    branches: [linux, main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils x11-apps libxcb-cursor0 libxkbcommon-x11-0 libegl1 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 \
            libdbus-1-3 libgl1 fonts-dejavu-core shared-mime-info
      - name: Python libraries
        run: pip install -r build/requirements-linux.txt
      - name: Install, run and uninstall with the install script
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c '
            set -e
            openbox & sleep 2
            bash build/install-linux.sh
            sleep 8
            test -x ~/.local/bin/deskspace
            test -f ~/.local/share/applications/deskspace.desktop
            test -f ~/.local/share/icons/hicolor/256x256/apps/deskspace.png
            pgrep -f "[v]env/bin/python.*deskspace.pyw"
            test -f ~/.config/autostart/deskspace.desktop
            bash build/install-linux.sh --uninstall
            sleep 1
            if pgrep -f "[v]env/bin/python.*deskspace.pyw"; then exit 1; fi
            test ! -e ~/.local/bin/deskspace
            test -d ~/DeskSpace
          '
      - name: Run the app
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c \
            'openbox & sleep 2; python tests/linux_smoke.py screenshots'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
