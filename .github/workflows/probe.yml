# Temporary: finds the None reference leak on Python 3.10.
name: None probe

on:
  push:
    branches: [linux]
    paths: ["tests/none_probe.py", ".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils libxcb-cursor0 libxkbcommon-x11-0 libegl1 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 libdbus-1-3 libgl1 \
            fonts-dejavu-core
      - run: pip install -r build/requirements-linux.txt
      - name: Probe
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & sleep 2; python tests/none_probe.py'
