# Temporary: which PySide6 versions leak references to None on Python 3.10?
name: None probe

on:
  push:
    branches: [linux]
    paths: ["tests/none_probe.py", ".github/workflows/probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        pyside: ["6.12.0", "6.11", "6.10", "6.9", "6.8"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0 libegl1 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-image0 libxcb-render-util0 libdbus-1-3 libgl1
      - run: pip install "PySide6_Essentials~=${{ matrix.pyside }}.0" || pip install "PySide6_Essentials==${{ matrix.pyside }}"
      - name: Probe
        run: xvfb-run -a python tests/none_probe.py
